name: Cron Job

permissions:
  contents: write

on:
  workflow_dispatch:
  schedule:
    - cron: '30 14 * * *'

jobs:
  random_push:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Decide Whether To Push
        run: |
          DAY=$(date -u +%u)
          WEEK=$(date -u +%V)
          YEAR=$(date -u +%G)

          # Pick 4 of the 5 weekdays (Mon=1 ... Fri=5), stable for the whole week
          RANDOM_DAYS=$(python3 -c "import random; random.seed('$YEAR-$WEEK'); print(*sorted(random.sample(range(1, 6), 4)))")
          echo "Selected days: $RANDOM_DAYS"

          if [[ " $RANDOM_DAYS " == *" $DAY "* ]]; then
            echo "SHOULD_PUSH=true" >> $GITHUB_ENV
          else
            echo "Today is not selected. Skipping."
            echo "SHOULD_PUSH=false" >> $GITHUB_ENV
          fi

      - name: Generate Random Time
        if: env.SHOULD_PUSH == 'true'
        run: |
          # 00:00-13:59 UTC so the timestamp is always before the 14:30 run
          HOUR=$((RANDOM % 14))
          MINUTE=$((RANDOM % 60))
          SECOND=$((RANDOM % 60))
          RANDOM_TIME=$(date -u -d "$HOUR:$MINUTE:$SECOND" +"%Y-%m-%d %H:%M:%S")
          echo "RANDOM_TIME=$RANDOM_TIME" >> $GITHUB_ENV

      - name: Sync With Latest Main
        if: env.SHOULD_PUSH == 'true'
        run: |
          git fetch origin main
          git reset --hard origin/main

      - name: Make Change
        if: env.SHOULD_PUSH == 'true'
        run: |
          echo "Updated at $RANDOM_TIME" >> daily_log.txt

      - name: Commit and Push
        if: env.SHOULD_PUSH == 'true'
        run: |
          git config user.name "deep-div"
          git config user.email "div20023041@gmail.com"

          git add daily_log.txt

          GIT_AUTHOR_DATE="$RANDOM_TIME" \
          GIT_COMMITTER_DATE="$RANDOM_TIME" \
          git commit -m "Random update"

          git push origin main
