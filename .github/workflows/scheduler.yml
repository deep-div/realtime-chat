name: Cron Job

permissions:
  contents: write

on:
  workflow_dispatch:
  schedule:
    - cron: '30 14 * * *'

jobs:
  random_push:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Decide Whether To Push
        run: |
          DAY=$(date +%u)
          WEEK=$(date +%V)
          YEAR=$(date +%Y)

          RANDOM_DAYS=$(python -c "import random; random.seed('$YEAR-$WEEK'); print(sorted(random.sample(range(1, 8), 5)))")

          echo "Selected days: $RANDOM_DAYS"

          if [[ ! " $RANDOM_DAYS " =~ " $DAY " ]]; then
            echo "Today is not selected. Skipping."
            exit 0
          fi

      - name: Generate Random Time
        run: |
          HOUR=$((RANDOM % 24))
          MINUTE=$((RANDOM % 60))
          RANDOM_TIME=$(date -d "$HOUR:$MINUTE" +"%Y-%m-%d %H:%M:%S")
          echo "RANDOM_TIME=$RANDOM_TIME" >> $GITHUB_ENV

      - name: Sync With Latest Main
        run: |
          git fetch origin main
          git reset --hard origin/main

      - name: Make Change
        run: |
          echo "Updated at $RANDOM_TIME" >> daily_log.txt

      - name: Commit and Push
        run: |
          git config user.name "deep-div"
          git config user.email "div20023041@gmail.com"

          git add daily_log.txt

          GIT_AUTHOR_DATE="$RANDOM_TIME" \
          GIT_COMMITTER_DATE="$RANDOM_TIME" \
          git commit -m "Random update"

          git push origin main
